version: "3.9"

services:
  goboxd:
    build:
      context: .
      dockerfile: Dockerfile
      target: nsjail-server
    image: goboxd:latest
    container_name: goboxd
    ports:
      - "8000:8000"
    # nsjail requires SYS_ADMIN (for chroot + namespace creation)
    # and PTRACE (for nsjail process tracking).
    # Using privileged is the simplest way to satisfy these in Docker.
    privileged: true
    restart: unless-stopped
    environment:
      - CONFIG_PATH=/app/config/languages.yaml
